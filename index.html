<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>帆飞之路 · 工作台</title>
<meta name="theme-color" content="#4A8DFF" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="帆飞之路" />
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icon-192.png" />
<link rel="icon" type="image/png" href="icon-192.png" />
<style>
/* ==========================================================
   基础变量（开发者模式可调）
   ========================================================== */
:root {
  --color-primary: #4A8DFF;
  --color-primary-2: #6FA1FF;
  --color-accent: #8E6FE0;
  --color-accent-2: #B49BFF;
  --color-bg: #E8EDF3;
  --color-bg-card: #FFFFFF;
  --color-bg-soft: #F0F4F8;
  --color-bg-sidebar: #F6F9FC;
  --color-bg-content: #E8EDF3;
  --color-text: #1F2937;
  --color-text-2: #5E6A7E;
  --color-text-3: #8C96AA;
  --color-text-on-primary: #FFFFFF;
  --color-border: #E3E8F0;
  --color-divider: #EDF1F7;
  --color-success: #2DC985;
  --color-warning: #F0B33A;
  --color-danger: #F25C5C;
  --color-info: #4A8DFF;
  --radius-sm: 8px;
  --radius-md: 14px;
  --radius-lg: 22px;
  --radius-xl: 28px;
  --shadow-card: 0 4px 20px rgba(30, 45, 80, 0.06);
  --shadow-soft: 0 2px 10px rgba(30, 45, 80, 0.04);
  --shadow-strong: 0 22px 50px rgba(20, 30, 60, 0.16);
  --shadow-fab: 0 6px 20px rgba(74, 141, 255, 0.35);
  --gradient-hero: linear-gradient(135deg, #4A8DFF 0%, #6B9DFF 45%, #9B7FE8 100%);
  --gradient-soft: linear-gradient(135deg, #EAF1FF 0%, #F2EAFE 100%);
  --font-family: "vivo Sans", "HarmonyOS Sans SC", "Source Han Sans CN", "Noto Sans CJK SC", "PingFang SC", "Microsoft YaHei", system-ui, -apple-system, sans-serif;
  --sidebar-width: 260px;
}

:root[data-theme="dark"] {
  --color-bg: #0D1117;
  --color-bg-card: #161B24;
  --color-bg-soft: #1C2230;
  --color-bg-sidebar: #121821;
  --color-bg-content: #0D1117;
  --color-text: #E8ECF4;
  --color-text-2: #A3ADC0;
  --color-text-3: #6E7891;
  --color-border: #252C3D;
  --color-divider: #1C2230;
  --shadow-card: 0 4px 20px rgba(0, 0, 0, 0.35);
  --shadow-soft: 0 2px 10px rgba(0, 0, 0, 0.25);
  --shadow-fab: 0 6px 20px rgba(74, 141, 255, 0.25);
  --gradient-soft: linear-gradient(135deg, #1B2336 0%, #211B36 100%);
}
:root[data-theme="dark"] .nav-item.active { background: rgba(74, 141, 255, 0.15); }

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  height: 100%;
  font-family: var(--font-family);
  color: var(--color-text);
  background: var(--color-bg);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  font-size: 14px;
  line-height: 1.5;
}
button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
input, textarea, select { font-family: inherit; outline: none; }
ul, ol { list-style: none; }
a { color: var(--color-primary); text-decoration: none; }
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-thumb { background: var(--color-border); border-radius: 3px; }
::-webkit-scrollbar-track { background: transparent; }

.app {
  display: flex;
  min-height: 100vh;
  width: 100%;
  background: var(--color-bg);
  overflow: hidden;
}

.sidebar {
  width: var(--sidebar-width);
  flex-shrink: 0;
  background: var(--color-bg-sidebar);
  display: flex;
  flex-direction: column;
  height: 100vh;
  position: sticky;
  top: 0;
  z-index: 50;
}
.sidebar-header {
  padding: 26px 20px 18px;
  display: flex;
  align-items: center;
  gap: 12px;
}
.sidebar-logo {
  width: 42px; height: 42px;
  border-radius: 14px;
  background: var(--gradient-hero);
  display: flex; align-items: center; justify-content: center;
  color: #fff;
  font-weight: 700;
  font-size: 20px;
  box-shadow: 0 4px 14px rgba(74, 141, 255, 0.28);
}
.sidebar-title { font-size: 16px; font-weight: 700; color: var(--color-text); }
.sidebar-subtitle { font-size: 12px; color: var(--color-text-3); margin-top: 2px; }

.sidebar-nav { flex: 1; overflow-y: auto; padding: 8px 14px; }
.nav-group-label {
  font-size: 12px;
  color: var(--color-text-3);
  padding: 16px 10px 8px;
  font-weight: 600;
}
.nav-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 12px;
  border-radius: var(--radius-md);
  cursor: pointer;
  color: var(--color-text);
  margin: 3px 0;
  transition: all 0.18s;
  position: relative;
}
.nav-item:hover { background: var(--color-bg-soft); }
.nav-item.active {
  background: #E8F0FE;
  color: var(--color-primary);
}
.nav-item.active .nav-icon { background: rgba(74, 141, 255, 0.12); color: var(--color-primary); }
.nav-icon {
  width: 36px; height: 36px;
  border-radius: 11px;
  background: var(--color-bg-soft);
  display: flex; align-items: center; justify-content: center;
  font-size: 16px;
  flex-shrink: 0;
}
.nav-item::after {
  content: "›";
  font-size: 20px;
  color: var(--color-text-3);
  margin-left: 4px;
  line-height: 1;
}
.nav-item.active::after { color: var(--color-primary); }
.nav-badge {
  margin-left: 8px;
  background: var(--color-danger);
  color: #fff;
  font-size: 10px;
  padding: 1px 6px;
  border-radius: 8px;
  font-weight: 600;
  flex-shrink: 0;
}

.sidebar-footer {
  padding: 12px 14px 18px;
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.footer-btn {
  display: flex; align-items: center; gap: 12px;
  padding: 9px 12px;
  border-radius: var(--radius-md);
  font-size: 13px;
  color: var(--color-text-2);
  cursor: pointer;
  transition: all 0.18s;
}
.footer-btn:hover { background: var(--color-bg-soft); color: var(--color-text); }
.footer-btn .nav-icon { width: 32px; height: 32px; font-size: 14px; }
.sidebar-version {
  font-size: 11px;
  color: var(--color-text-3);
  padding: 10px 14px 0;
  line-height: 1.5;
}

.main {
  flex: 1;
  display: flex;
  flex-direction: column;
  min-width: 0;
  background: var(--color-bg-content);
  position: relative;
}

.topbar {
  height: 64px;
  background: var(--color-bg);
  display: flex;
  align-items: center;
  padding: 0 22px;
  gap: 14px;
  position: sticky;
  top: 0;
  z-index: 40;
}
.topbar-menu {
  width: 38px; height: 38px;
  border-radius: 12px;
  display: none; align-items: center; justify-content: center;
  color: var(--color-text);
  background: var(--color-bg-card);
  font-size: 18px;
  box-shadow: var(--shadow-soft);
  flex-shrink: 0;
}
.topbar-menu:hover { background: var(--color-bg-soft); }
.topbar-title-group { display: flex; flex-direction: column; }
.topbar-title { font-size: 15px; font-weight: 700; color: var(--color-text); }
.topbar-desc { font-size: 12px; font-weight: 500; color: var(--color-text-3); }
.topbar-right { margin-left: auto; display: flex; gap: 8px; align-items: center; }
.topbar-btn {
  width: 38px; height: 38px;
  border-radius: 12px;
  display: flex; align-items: center; justify-content: center;
  color: #fff;
  background: var(--gradient-hero);
  font-size: 18px;
  transition: all 0.18s;
  box-shadow: var(--shadow-soft);
  position: relative;
}
.topbar-btn:hover { transform: translateY(-1px); box-shadow: var(--shadow-card); }

.content {
  flex: 1;
  padding: 8px 22px 28px;
  overflow-y: auto;
  min-height: 0;
}
.module-view { display: none; }
.module-view.active { display: block; animation: fadeIn 0.25s ease; }
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(6px); }
  to { opacity: 1; transform: translateY(0); }
}

/* PWA safe area */
body { padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom); }
.topbar { padding-top: env(safe-area-inset-top); }
.sidebar { padding-top: env(safe-area-inset-top); }
.fab { bottom: calc(22px + env(safe-area-inset-bottom)); }
@media (display-mode: standalone) {
  .topbar { padding-top: calc(env(safe-area-inset-top) + 4px); height: auto; min-height: 64px; }
}

.card {
  background: var(--color-bg-card);
  border-radius: var(--radius-xl);
  padding: 20px;
  box-shadow: var(--shadow-card);
  border: none;
}
.card-title {
  font-size: 15px;
  font-weight: 700;
  color: var(--color-text);
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 14px;
}
.card-title-icon {
  width: 26px; height: 26px;
  border-radius: 8px;
  background: var(--gradient-soft);
  color: var(--color-primary);
  display: flex; align-items: center; justify-content: center;
  font-size: 13px;
}
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 8px 16px;
  border-radius: 10px;
  font-size: 13px;
  font-weight: 500;
  transition: all 0.18s;
  white-space: nowrap;
}
.btn-primary {
  background: var(--gradient-hero);
  color: #fff;
  box-shadow: 0 4px 10px rgba(74, 141, 255, 0.25);
}
.btn-primary:hover { transform: translateY(-1px); box-shadow: 0 6px 14px rgba(74, 141, 255, 0.35); }
.btn-soft {
  background: var(--gradient-soft);
  color: var(--color-primary);
}
.btn-soft:hover { background: rgba(74, 141, 255, 0.15); }
.btn-ghost {
  background: transparent;
  color: var(--color-text-2);
  border: 1px solid var(--color-border);
}
.btn-ghost:hover { background: var(--color-bg-soft); color: var(--color-text); }
.btn-danger {
  background: rgba(242, 92, 92, 0.1);
  color: var(--color-danger);
}
.btn-danger:hover { background: rgba(242, 92, 92, 0.18); }
.btn-sm { padding: 5px 10px; font-size: 12px; }

.input, .select, .textarea {
  width: 100%;
  padding: 9px 12px;
  background: var(--color-bg-soft);
  border: 1px solid var(--color-border);
  border-radius: 10px;
  font-size: 13px;
  color: var(--color-text);
  transition: all 0.18s;
}
.input:focus, .select:focus, .textarea:focus {
  border-color: var(--color-primary);
  background: var(--color-bg-card);
  box-shadow: 0 0 0 3px rgba(74, 141, 255, 0.12);
}
.textarea { resize: vertical; min-height: 70px; line-height: 1.55; }
.input::placeholder, .textarea::placeholder { color: var(--color-text-3); }

.form-row { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; }
.form-label { font-size: 12px; color: var(--color-text-2); font-weight: 500; }
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.form-grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }

.empty-state { text-align: center; padding: 40px 20px; color: var(--color-text-3); font-size: 13px; }
.empty-state-icon { font-size: 36px; margin-bottom: 10px; opacity: 0.4; }

.row-flex { display: flex; align-items: center; gap: 8px; }
.row-between { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.text-2 { color: var(--color-text-2); }
.text-3 { color: var(--color-text-3); }
.text-primary { color: var(--color-primary); }
.text-success { color: var(--color-success); }
.text-danger { color: var(--color-danger); }
.text-warning { color: var(--color-warning); }
.fs-12 { font-size: 12px; }
.fs-13 { font-size: 13px; }
.fs-15 { font-size: 15px; }
.fs-18 { font-size: 18px; }
.fw-600 { font-weight: 600; }

.sleep-hero {
  background: var(--gradient-hero);
  border-radius: var(--radius-xl);
  padding: 24px;
  color: #fff;
  margin-bottom: 18px;
  position: relative;
  overflow: hidden;
}
.sleep-hero::after {
  content: "";
  position: absolute;
  right: -40px; top: -40px;
  width: 160px; height: 160px;
  background: rgba(255,255,255,0.08);
  border-radius: 50%;
}
.sleep-hero-label { font-size: 12px; opacity: 0.85; }
.sleep-hero-time {
  font-size: 38px;
  font-weight: 700;
  margin: 4px 0;
  font-variant-numeric: tabular-nums;
  letter-spacing: 1px;
}
.sleep-hero-meta { display: flex; gap: 16px; margin-top: 10px; font-size: 12px; opacity: 0.9; flex-wrap: wrap; }
.sleep-hero-meta span { display: flex; align-items: center; gap: 4px; }

.week-bar-chart {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 8px;
  height: 160px;
  padding: 14px 8px 6px;
}
.week-bar-col {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  height: 100%;
}
.week-bar-wrap {
  flex: 1;
  width: 100%;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  position: relative;
}
.week-bar {
  width: 60%;
  max-width: 28px;
  background: var(--gradient-hero);
  border-radius: 6px 6px 2px 2px;
  position: relative;
  transition: all 0.3s;
  min-height: 4px;
}
.week-bar.early { background: linear-gradient(180deg, #2DC985 0%, #2DC985 100%); }
.week-bar.mid { background: linear-gradient(180deg, #4A8DFF 0%, #6FA1FF 100%); }
.week-bar.late { background: linear-gradient(180deg, #F0B33A 0%, #F0B33A 100%); }
.week-bar.very-late { background: linear-gradient(180deg, #F25C5C 0%, #F25C5C 100%); }
.week-bar-label {
  position: absolute;
  top: -18px;
  left: 50%;
  transform: translateX(-50%);
  font-size: 10px;
  color: var(--color-text-3);
  white-space: nowrap;
}
.week-bar-day {
  font-size: 11px;
  color: var(--color-text-2);
  font-weight: 500;
}
.week-bar-day.today { color: var(--color-primary); font-weight: 700; }

.sleep-stats {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 10px;
  margin-top: 14px;
}
.sleep-stat {
  background: var(--color-bg-soft);
  border-radius: var(--radius-md);
  padding: 12px;
  text-align: center;
}
.sleep-stat-label { font-size: 11px; color: var(--color-text-3); }
.sleep-stat-value { font-size: 18px; font-weight: 700; color: var(--color-text); margin-top: 4px; font-variant-numeric: tabular-nums; }
.sleep-stat-value .unit { font-size: 11px; color: var(--color-text-3); font-weight: 500; margin-left: 2px; }

.sleep-list { max-height: 240px; overflow-y: auto; }
.sleep-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 0;
  border-bottom: 1px solid var(--color-divider);
}
.sleep-item:last-child { border-bottom: none; }
.sleep-item-date { font-size: 12px; color: var(--color-text-2); min-width: 90px; }
.sleep-item-time { font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums; }
.sleep-item-tag {
  margin-left: auto;
  font-size: 11px;
  padding: 2px 8px;
  border-radius: 6px;
  background: var(--color-bg-soft);
  color: var(--color-text-2);
}
.sleep-item-tag.good { background: rgba(45, 201, 133, 0.12); color: var(--color-success); }
.sleep-item-tag.bad { background: rgba(242, 92, 92, 0.12); color: var(--color-danger); }

.exercise-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 0;
  border: none;
  border-radius: var(--radius-xl);
  overflow: hidden;
  background: var(--color-bg-card);
  box-shadow: var(--shadow-card);
}
.exercise-cell {
  padding: 14px 16px;
  border-bottom: 1px solid var(--color-divider);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}
.exercise-cell:nth-last-child(-n+2) { border-bottom: none; }
.exercise-cell-name { font-weight: 600; font-size: 13px; }
.exercise-cell-time { color: var(--color-text-2); font-variant-numeric: tabular-nums; font-size: 13px; }
.exercise-cell-actions { display: flex; gap: 4px; }
.exercise-cell-actions button {
  width: 24px; height: 24px;
  border-radius: 6px;
  background: var(--color-bg-soft);
  color: var(--color-text-3);
  font-size: 12px;
  display: flex; align-items: center; justify-content: center;
}
.exercise-cell-actions button:hover { background: var(--color-divider); color: var(--color-text); }
.exercise-cell-actions button.delete:hover { background: rgba(242, 92, 92, 0.15); color: var(--color-danger); }

.exercise-summary {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  margin-bottom: 18px;
}
.exercise-stat {
  background: var(--color-bg-card);
  border-radius: var(--radius-lg);
  padding: 16px;
  text-align: center;
  box-shadow: var(--shadow-card);
}
.exercise-stat-icon { font-size: 20px; margin-bottom: 4px; }
.exercise-stat-value { font-size: 18px; font-weight: 700; color: var(--color-text); }
.exercise-stat-label { font-size: 11px; color: var(--color-text-3); margin-top: 2px; }

.tabs {
  display: flex;
  gap: 4px;
  background: var(--color-bg-soft);
  padding: 4px;
  border-radius: 12px;
  margin-bottom: 16px;
  width: fit-content;
}
.tab {
  padding: 7px 18px;
  border-radius: 9px;
  font-size: 13px;
  color: var(--color-text-2);
  font-weight: 500;
  transition: all 0.18s;
  cursor: pointer;
}
.tab.active {
  background: var(--color-bg-card);
  color: var(--color-primary);
  font-weight: 600;
  box-shadow: 0 2px 6px rgba(20, 30, 60, 0.08);
}
.tab-panel { display: none; }
.tab-panel.active { display: block; animation: fadeIn 0.25s ease; }

.sector-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  gap: 12px;
}
.sector-card {
  background: var(--color-bg-card);
  border-radius: var(--radius-lg);
  padding: 16px;
  box-shadow: var(--shadow-card);
  transition: all 0.2s;
}
.sector-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-card); }
.sector-head { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.sector-icon {
  width: 32px; height: 32px;
  border-radius: 9px;
  display: flex; align-items: center; justify-content: center;
  font-size: 16px;
  color: #fff;
  flex-shrink: 0;
}
.sector-name { font-size: 13.5px; font-weight: 600; }
.sector-list { display: flex; flex-direction: column; gap: 6px; margin-top: 8px; }
.sector-item {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 5px 0;
  font-size: 12px;
  color: var(--color-text-2);
  border-top: 1px solid var(--color-divider);
  padding-top: 7px;
}
.sector-item:first-child { border-top: none; padding-top: 0; }
.sector-item-stock { font-weight: 600; color: var(--color-text); }
.sector-item-change { margin-left: auto; font-variant-numeric: tabular-nums; font-weight: 600; }
.sector-item-change.up { color: var(--color-danger); }
.sector-item-change.down { color: var(--color-success); }

.holdings-list { display: flex; flex-direction: column; gap: 10px; }
.holding-card {
  background: var(--color-bg-card);
  border-radius: var(--radius-lg);
  padding: 16px 18px;
  box-shadow: var(--shadow-card);
  display: flex;
  align-items: center;
  gap: 12px;
}
.holding-name { font-size: 14px; font-weight: 600; }
.holding-code { font-size: 11px; color: var(--color-text-3); }
.holding-amount { margin-left: auto; text-align: right; }
.holding-amount-value { font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums; }
.holding-amount-label { font-size: 11px; color: var(--color-text-3); }
.holding-actions { display: flex; flex-direction: column; gap: 4px; margin-left: 4px; }
.holding-actions button {
  width: 26px; height: 22px;
  border-radius: 5px;
  font-size: 11px;
  display: flex; align-items: center; justify-content: center;
  background: var(--color-bg-soft);
  color: var(--color-text-3);
}
.holding-actions button:hover { background: var(--color-divider); color: var(--color-text); }
.holding-actions button.delete:hover { background: rgba(242, 92, 92, 0.15); color: var(--color-danger); }

.ai-tip-card {
  background: linear-gradient(135deg, rgba(74, 141, 255, 0.06), rgba(142, 111, 224, 0.06));
  border: 1px dashed var(--color-primary);
  border-radius: var(--radius-md);
  padding: 14px;
  margin-top: 14px;
  font-size: 12.5px;
  color: var(--color-text-2);
  line-height: 1.65;

      </div>
      <div class="footer-btn" data-action="theme">
        <div class="nav-icon">🌓</div>
        <span>切换主题</span>
      </div>
      <div class="sidebar-version">数据保存在当前设备<br>v1.0 · 本地优先</div>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <button class="topbar-menu" id="topbarMenu" title="打开导航">☰</button>
      <div class="topbar-title-group">
        <div class="topbar-title">帆 工作台</div>
        <div class="topbar-desc" id="topbarDesc">今天</div>
      </div>
      <div class="topbar-right">
        <button class="topbar-btn" id="topbarAdd" title="快速添加">+</button>
      </div>
    </header>

    <div class="content" id="content"></div>
    <button class="fab" id="fabBtn" title="快速添加">+</button>
  </main>
</div>

<div class="sidebar-overlay" id="sidebarOverlay"></div>

<div class="modal-mask" id="modalMask">
  <div class="modal" id="modal">
    <div class="modal-header">
      <div class="modal-title" id="modalTitle">标题</div>
      <button class="modal-close" data-close>×</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-footer" id="modalFooter"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ==========================================================
   全局数据
   ========================================================== */
const STORE_KEY = 'fanfei_workspace_v1';
const SETTINGS_KEY = 'fanfei_settings_v1';
const THEME_KEY = 'fanfei_theme_v1';
const COLOR_KEY = 'fanfei_colors_v1';

const defaultModules = [
  { id: 'home',      name: '今天',       icon: '☀️', group: 'main', visible: true, builtIn: true, desc: '今日三件事与进度' },
  { id: 'sleep',     name: '睡觉记录',   icon: '🌙', group: 'life', visible: true, builtIn: true, desc: '追踪每天的睡眠节律' },
  { id: 'exercise',  name: '锻炼打卡',   icon: '🏃', group: 'life', visible: true, builtIn: true, desc: '坚持每天的运动打卡' },
  { id: 'invest',    name: '投资',       icon: '📈', group: 'finance', visible: true, builtIn: true, desc: '板块热点与持仓分析' },
  { id: 'expense',   name: '每日支出',   icon: '💰', group: 'finance', visible: true, builtIn: true, desc: '自动归类每日支出' },
  { id: 'saving',    name: '存款记录',   icon: '🏦', group: 'finance', visible: true, builtIn: true, desc: '记录每一笔存款' },
  { id: 'english',   name: '英语学习',   icon: '🇬🇧', group: 'growth', visible: true, builtIn: true, desc: '日常对话与专业英语' },
  { id: 'reading',   name: '看书',       icon: '📚', group: 'growth', visible: true, builtIn: true, desc: '阅读进度与观后感' },
  { id: 'thoughts',  name: '想法',       icon: '💭', group: 'growth', visible: true, builtIn: true, desc: '记录想法，每周智能总结' },
  { id: 'skill',     name: '技能',       icon: '🎯', group: 'me',    visible: true, builtIn: true, desc: '技能清单与成长建议' },
  { id: 'dev',       name: '开发者',     icon: '🎨', group: 'me',    visible: true, builtIn: true, desc: '调整界面配色与主题' },
];

const groupLabels = { main: ' ', life: '生活', finance: '财务', growth: '成长', me: '我的' };
const groupOrder  = ['main', 'life', 'finance', 'growth', 'me'];

let state = {
  current: 'home',
  theme: 'light',
  modules: defaultModules.slice(),
  sleep: {},
  exercises: [],
  holdings: [],
  savings: {},
  expenses: [],
  books: [],
  thoughts: [],
  skills: [],
  customColors: {},
};

function loadState() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (raw) Object.assign(state, JSON.parse(raw));
    const settings = localStorage.getItem(SETTINGS_KEY);
    if (settings) {
      const s = JSON.parse(settings);
      if (s.theme) state.theme = s.theme;
      if (s.modules && s.modules.length) state.modules = s.modules;
    }
    const colors = localStorage.getItem(COLOR_KEY);
    if (colors) state.customColors = JSON.parse(colors);
  } catch (e) { console.error('loadState error', e); }
}

function saveState() {
  try {
    const data = {
      sleep: state.sleep, exercises: state.exercises, holdings: state.holdings,
      savings: state.savings, expenses: state.expenses, books: state.books,
      thoughts: state.thoughts, skills: state.skills,
    };
    localStorage.setItem(STORE_KEY, JSON.stringify(data));
    localStorage.setItem(SETTINGS_KEY, JSON.stringify({ theme: state.theme, modules: state.modules }));
    if (Object.keys(state.customColors).length) {
      localStorage.setItem(COLOR_KEY, JSON.stringify(state.customColors));
    }
  } catch (e) { toast('保存失败：' + e.message, 'error'); }
}

const $ = (s, p = document) => p.querySelector(s);
const $$ = (s, p = document) => Array.from(p.querySelectorAll(s));
const pad = n => n.toString().padStart(2, '0');
const dateStr = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const todayStr = () => dateStr(new Date());
const nowTime = () => `${pad(new Date().getHours())}:${pad(new Date().getMinutes())}`;
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const fmtMoney = n => Number(n || 0).toLocaleString('zh-CN', { minimumFractionDigits: 0, maximumFractionDigits: 2 });
function timeToMinutes(t) { if (!t) return 0; const [h, m] = t.split(':').map(Number); return h * 60 + m; }
function minutesToTimeStr(mins) { mins = ((mins % 1440) + 1440) % 1440; return `${pad(Math.floor(mins/60))}:${pad(mins % 60)}`; }
function normalizeSleepTime(t) {
  const m = timeToMinutes(t);
  if (m >= 22 * 60) return { val: m, isNextDay: false, display: t };
  if (m <= 3 * 60) return { val: m + 24 * 60, isNextDay: true, display: t };
  return null;
}
function escapeHtml(s) {
  return String(s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function toast(msg, type = 'success') {
  const el = $('#toast');
  el.textContent = msg;
  el.className = 'toast show ' + type;
  clearTimeout(toast._t);
  toast._t = setTimeout(() => el.className = 'toast', 2200);
}

function openModal(title, bodyHTML, footerHTML = '', large = false) {
  $('#modalTitle').textContent = title;
  $('#modalBody').innerHTML = bodyHTML;
  $('#modalFooter').innerHTML = footerHTML;
  $('#modal').classList.toggle('modal-large', large);
  $('#modalMask').classList.add('show');
}
function closeModal() { $('#modalMask').classList.remove('show'); }

function applyTheme(theme) {
  state.theme = theme;
  document.documentElement.dataset.theme = theme === 'dark' ? 'dark' : '';
  saveState();
}

function applyCustomColors() {
  const root = document.documentElement;
  Object.entries(state.customColors).forEach(([k, v]) => root.style.setProperty(k, v));
}

/* ==========================================================
   导航
   ========================================================== */
function renderSidebar() {
  const nav = $('#sidebarNav');
  const groups = {};
  state.modules.filter(m => m.visible).forEach(m => {
    if (!groups[m.group]) groups[m.group] = [];
    groups[m.group].push(m);
  });
  let html = '';
  groupOrder.forEach(g => {
    if (!groups[g] || !groups[g].length) return;
    if (groupLabels[g] && groupLabels[g].trim()) {
      html += `<div class="nav-group-label">${groupLabels[g]}</div>`;
    }
    groups[g].forEach(m => {
      const badge = m.id === 'thoughts' && state.thoughts.length ? `<span class="nav-badge">${state.thoughts.length}</span>` : '';
      const desc = m.desc || getModuleDesc(m.id);
      html += `<div class="nav-item ${state.current === m.id ? 'active' : ''}" data-module="${m.id}">
        <div class="nav-icon">${m.icon}</div>
        <div style="flex:1; min-width:0;">
          <div style="font-size:14px; font-weight:700; line-height:1.3;">${escapeHtml(m.name)}</div>
          <div style="font-size:11px; color:var(--color-text-3); font-weight:500; line-height:1.3;">${escapeHtml(desc)}</div>
        </div>
        ${badge}
      </div>`;
    });
  });
  nav.innerHTML = html;
  $$('#sidebarNav .nav-item').forEach(el => {
    el.addEventListener('click', () => {
      switchModule(el.dataset.module);
      closeSidebar();
    });
  });
}

function switchModule(id) {
  state.current = id;
  renderSidebar();
  renderContent();
  saveState();
}

function getModuleDesc(id) {
  const map = {
    home: '把重要的事放在手边',
    sleep: '追踪每天的睡眠节律',
    exercise: '坚持每天的运动打卡',
    invest: '板块热点与持仓分析',
    english: '日常对话与专业英语',
    saving: '记录每一笔存款',
    expense: '自动归类每日支出',
    reading: '阅读进度与观后感',
    thoughts: '记录想法，每周智能总结',
    skill: '技能清单与成长建议',
    dev: '调整界面配色与主题',
  };
  return map[id] || '';
}

function renderContent() {
  const c = $('#content');
  const m = state.modules.find(x => x.id === state.current) || state.modules[0];
  $('#topbarDesc').textContent = m.name;
  let html = '';
  switch (state.current) {
    case 'home':     html = viewHome(); break;
    case 'sleep':    html = viewSleep(); break;
    case 'exercise': html = viewExercise(); break;
    case 'invest':   html = viewInvest(); break;
    case 'english':  html = viewEnglish(); break;
    case 'saving':   html = viewSaving(); break;
    case 'expense':  html = viewExpense(); break;
    case 'reading':  html = viewReading(); break;
    case 'thoughts': html = viewThoughts(); break;
    case 'skill':    html = viewSkill(); break;
    case 'dev':      html = viewDev(); break;
    default:         html = viewHome();
  }
  c.innerHTML = html;
  bindModuleEvents();
  if (state.current === 'english') {
    renderDialogues();
    renderProEnglish();
  }
}

/* ==========================================================
   Home
   ========================================================== */
function viewHome() {
  const now = new Date();
  const weekdays = ['星期日','星期一','星期二','星期三','星期四','星期五','星期六'];
  const date = `${now.getMonth()+1}月${now.getDate()}日 · ${weekdays[now.getDay()]}`;
  const greeting = (() => {
    const h = now.getHours();
    if (h < 5) return '夜深了';
    if (h < 11) return '早上好';
    if (h < 14) return '中午好';
    if (h < 18) return '下午好';
    return '晚上好';
  })();

  const tasks = [];
  if (state.thoughts.length) tasks.push({ icon: '💭', title: '回顾最近想法：' + state.thoughts[state.thoughts.length-1].content.slice(0, 14) + '...' });
  if (state.books.length) {
    const last = state.books[state.books.length-1];
    if (last.current < last.total) tasks.push({ icon: '📚', title: '继续阅读《' + last.name + '》' });
  }
  if (state.exercises.length) tasks.push({ icon: '🏃', title: '今日运动：' + state.exercises[state.exercises.length-1].name });

  const todos = [];
  state.books.forEach(b => {
    if (b.current < b.total) todos.push({ icon: '📖', text: '继续阅读《' + b.name + '》', meta: `已读 ${b.current}/${b.total} 页` });
  });
  state.skills.forEach(s => {
    if (s.level < 5) todos.push({ icon: '🎯', text: '提升技能：' + s.name, meta: `当前 ${s.level}/5` });
  });
  if (todos.length === 0) todos.push({ icon: '✏️', text: '在「想法」中记录第一个灵感', meta: '今日灵感' });

  const monthExp = state.expenses
    .filter(e => e.date.startsWith(now.toISOString().slice(0,7)))
    .reduce((s, e) => s + Number(e.amount || 0), 0);
  const monthSave = Object.entries(state.savings)
    .filter(([k]) => k.startsWith(now.toISOString().slice(0,7)))
    .reduce((s, [, v]) => s + Number(v || 0), 0);
  const totalHoldings = state.holdings.reduce((s, h) => s + Number(h.amount || 0), 0);

  return `
    <div class="card" style="background: var(--gradient-hero); color:#fff; padding: 24px; position:relative; overflow:hidden; margin-bottom: 16px;">
      <div style="font-size:12px; opacity:0.85;">${date}</div>
      <div style="font-size:24px; font-weight:700; margin: 6px 0;">${greeting}，帆</div>
      <div style="font-size:13px; opacity:0.9;">${tasks.length ? '今天有 ' + tasks.length + ' 件事值得关注' : '先把今天最重要的一步走完'}</div>
      <button class="btn" style="position:absolute; right:20px; top:20px; background:rgba(255,255,255,0.22); color:#fff; border-radius:20px; padding: 6px 14px; font-size:12px; backdrop-filter:blur(4px);" onclick="openQuickAdd()">+ 添加</button>
      <div style="position:absolute; right:-30px; top:-30px; width:140px; height:140px; background:rgba(255,255,255,0.1); border-radius:50%;"></div>
    </div>

    <div class="card" style="margin-bottom: 16px;">
      <div class="row-between" style="margin-bottom: 14px;">
        <div class="card-title" style="margin:0;"><div class="card-title-icon">💡</div>今日三件事</div>
        <span class="text-3 fs-12" style="font-weight:600;">0/${tasks.length || 1}</span>
      </div>
      <div style="font-size:12px; color:var(--color-text-3); margin-bottom:12px;">完成一件，今天就向前一步</div>
      ${(tasks.length ? tasks : [{title: '在想法中记录一个灵感', icon: '💭'}]).map((t, i) => `
        <div style="display:flex; align-items:center; gap:12px; padding:12px 0; border-top:${i>0?'1px solid var(--color-divider)':'none'};">
          <div style="width:28px; height:28px; border-radius:50%; background:rgba(74,141,255,0.12); color:var(--color-primary); display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:700;">${i+1}</div>
          <div style="flex:1; font-size:13.5px;">${t.icon} ${escapeHtml(t.title)}</div>
        </div>
      `).join('')}
    </div>

    <div class="card" style="margin-bottom: 16px;">
      <div class="row-between" style="margin-bottom: 14px;">
        <div class="card-title" style="margin:0;"><div class="card-title-icon">📋</div>待办清单</div>
        <button class="btn btn-sm btn-soft" data-go="reading">查看全部</button>
      </div>
      <div style="font-size:12px; color:var(--color-text-3); margin-bottom:12px;">按截止时间收拢工作</div>
      ${todos.slice(0, 4).map(t => `
        <div style="display:flex; align-items:center; gap:12px; padding:12px 0; border-top: 1px solid var(--color-divider);">
          <div style="width:8px; height:8px; border-radius:50%; background: var(--color-primary);"></div>
          <div style="flex:1;">
            <div style="font-size:13.5px; font-weight:500;">${t.icon} ${escapeHtml(t.text)}</div>
            <div style="font-size:11px; color:var(--color-text-3); margin-top:2px;">${escapeHtml(t.meta)}</div>
          </div>
          <div style="color:var(--color-text-3); font-size:16px;">›</div>
        </div>
      `).join('')}
    </div>

    <div class="card" style="background: linear-gradient(135deg, #2B3A55 0%, #4A5D82 100%); color: #fff;">
      <div class="row-between">
        <div>
          <div style="font-size:14px; font-weight:700;">财务速览 💰</div>
          <div style="font-size:11px; opacity:0.75; margin-top:4px;">本月支出 ¥${fmtMoney(monthExp)} · 存款 ¥${fmtMoney(monthSave)} · 持仓 ¥${fmtMoney(totalHoldings)}</div>
        </div>
        <button class="btn btn-sm" style="background:rgba(255,255,255,0.18); color:#fff;" data-go="expense">隐藏</button>
      </div>
    </div>
  `;
}

/* ==========================================================
   模块 1: 睡觉
   ========================================================== */
function viewSleep() {
  const today = new Date();
  const day = (today.getDay() + 6) % 7;
  const monday = new Date(today);
  monday.setDate(today.getDate() - day);
  const week = [];
  for (let i = 0; i < 7; i++) {
    const d = new Date(monday);
    d.setDate(monday.getDate() + i);
    week.push(d);
  }

  const weekData = week.map(d => {
    const key = dateStr(d);
    const rec = state.sleep[key];
    const norm = rec ? normalizeSleepTime(rec.time) : null;
    let label = '—', cls = '';
    if (norm) {
      if (norm.val <= 22 * 60 + 30) { label = norm.display; cls = 'early'; }
      else if (norm.val <= 23 * 60 + 30) { label = norm.display; cls = 'mid'; }
      else if (norm.val <= 24 * 60 + 60) { label = norm.display; cls = 'late'; }
      else { label = norm.display; cls = 'very-late'; }
    }
    return { date: d, key, label, cls, isToday: key === todayStr() };
  });

  const validTimes = weekData.filter(w => w.label !== '—').map(w => {
    const norm = normalizeSleepTime(w.label);
    return norm ? { val: norm.val, isNextDay: norm.isNextDay } : null;
  }).filter(Boolean);

  const avgMin = validTimes.length
    ? Math.round(validTimes.reduce((s, t) => s + t.val, 0) / validTimes.length)
    : 0;

  const todayRec = state.sleep[todayStr()];
  const todayNorm = todayRec ? normalizeSleepTime(todayRec.time) : null;
  const todayDisplay = todayNorm ? todayNorm.display : '尚未记录';

  const recent = Object.entries(state.sleep)
    .sort((a, b) => b[0].localeCompare(a[0]))
    .slice(0, 7);

  const maxVal = 24 * 60 + 60;
  const minVal = 21 * 60;

  return `
    <div class="sleep-hero">
      <div class="sleep-hero-label">📱 今日最后灭屏时间</div>
      <div class="sleep-hero-time">${todayDisplay}</div>
      <div class="sleep-hero-meta">
        <span>📅 ${today.getMonth()+1}月${today.getDate()}日</span>
        <span>🎯 目标：22:30 前</span>
        <span>${todayNorm ? (todayNorm.val <= 23*60 ? '✅ 良好' : '⚠️ 偏晚') : '⏰ 待记录'}</span>
      </div>
      <div style="margin-top:14px; display:flex; gap:8px;">
        <button class="btn btn-sm" style="background:rgba(255,255,255,0.2); color:#fff;" onclick="recordSleepNow()">📲 记录现在灭屏</button>
        <button class="btn btn-sm" style="background:rgba(255,255,255,0.2); color:#fff;" onclick="openSleepManual()">✏️ 手动补录</button>
      </div>
    </div>

    <div class="card" style="margin-bottom: 14px;">
      <div class="row-between" style="margin-bottom: 12px;">
        <div class="card-title" style="margin:0;"><div class="card-title-icon">📊</div>本周睡眠柱状图</div>
        <span class="text-3 fs-12">🟢早 · 🔵适中 · 🟡偏晚 · 🔴熬夜</span>
      </div>
      <div class="week-bar-chart">
        ${weekData.map((w, i) => {
          const norm = w.label === '—' ? null : normalizeSleepTime(w.label);
          const height = norm ? Math.max(8, ((norm.val - minVal) / (maxVal - minVal)) * 100) : 4;
          return `
            <div class="week-bar-col">
              <div class="week-bar-wrap">
                <div class="week-bar ${w.cls}" style="height: ${height}%">
                  ${w.label !== '—' ? `<div class="week-bar-label">${w.label}</div>` : ''}
                </div>
              </div>
              <div class="week-bar-day ${w.isToday ? 'today' : ''}">${['一','二','三','四','五','六','日'][i]}</div>
            </div>
          `;
        }).join('')}
      </div>
      <div class="sleep-stats">
        <div class="sleep-stat">
          <div class="sleep-stat-label">本周平均</div>
          <div class="sleep-stat-value" style="font-size:14px;">${avgMin ? minutesToTimeStr(avgMin) : '--'}</div>
        </div>
        <div class="sleep-stat">
          <div class="sleep-stat-label">最早入睡</div>
          <div class="sleep-stat-value" style="font-size:14px;">${validTimes.length ? minutesToTimeStr(Math.min(...validTimes.map(t => t.val))) : '--'}</div>
        </div>
        <div class="sleep-stat">
          <div class="sleep-stat-label">最晚入睡</div>
          <div class="sleep-stat-value" style="font-size:14px;">${validTimes.length ? minutesToTimeStr(Math.max(...validTimes.map(t => t.val))) : '--'}</div>
        </div>
        <div class="sleep-stat">
          <div class="sleep-stat-label">记录天数</div>
          <div class="sleep-stat-value">${validTimes.length}<span class="unit">/7</span></div>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="card-title"><div class="card-title-icon">📝</div>最近记录</div>
      <div class="sleep-list">
        ${recent.length === 0 ? '<div class="empty-state"><div class="empty-state-icon">🌙</div>暂无记录，点击上方"记录现在灭屏"开始</div>' :
          recent.map(([d, r]) => {
            const norm = normalizeSleepTime(r.time);
            const tag = !norm ? '无效时间' : (norm.val <= 22*60+30 ? '早睡' : norm.val <= 23*60+30 ? '适中' : norm.val <= 24*60+30 ? '偏晚' : '熬夜');
            const tagCls = norm && norm.val <= 22*60+30 ? 'good' : (norm && norm.val >= 24*60+30 ? 'bad' : '');
            return `<div class="sleep-item">
              <div class="sleep-item-date">${d}</div>
              <div class="sleep-item-time">${r.time}</div>
              <div class="sleep-item-tag ${tagCls}">${tag}</div>
            </div>`;
          }).join('')
        }
      </div>
    </div>
  `;
}

function recordSleepNow() {
  state.sleep[todayStr()] = { time: nowTime(), timestamp: Date.now() };
  saveState();
  renderContent();
  toast('已记录：' + nowTime());
}

function openSleepManual() {
  const body = `
    <div class="form-row">
      <label class="form-label">日期</label>
      <input class="input" id="sleepDate" type="date" value="${todayStr()}">
    </div>
    <div class="form-row">

function viewExercise() {
  const weekStart = new Date();
  weekStart.setDate(weekStart.getDate() - 6);
  const recent = state.exercises.filter(e => e.date >= dateStr(weekStart));
  const totalMin = recent.reduce((s, e) => s + Number(e.duration || 0), 0);
  const days = new Set(recent.map(e => e.date)).size;
  const avg = days ? Math.round(totalMin / 7) : 0;

  const grouped = {};
  state.exercises.forEach(e => {
    if (!grouped[e.name]) grouped[e.name] = { name: e.name, list: [], total: 0 };
    grouped[e.name].list.push(e);
    grouped[e.name].total += Number(e.duration || 0);
  });
  const items = Object.values(grouped).sort((a, b) => b.total - a.total).slice(0, 5);
  while (items.length < 5) items.push({ name: '—', total: 0, list: [], empty: true });

  return `
    <div class="exercise-summary">
      <div class="exercise-stat">
        <div class="exercise-stat-icon">⏱️</div>
        <div class="exercise-stat-value">${totalMin}<span style="font-size:11px; color:var(--color-text-3);"> 分钟</span></div>
        <div class="exercise-stat-label">本周运动</div>
      </div>
      <div class="exercise-stat">
        <div class="exercise-stat-icon">📅</div>
        <div class="exercise-stat-value">${days}<span style="font-size:11px; color:var(--color-text-3);"> /7</span></div>
        <div class="exercise-stat-label">本周天数</div>
      </div>
      <div class="exercise-stat">
        <div class="exercise-stat-icon">📊</div>
        <div class="exercise-stat-value">${avg}<span style="font-size:11px; color:var(--color-text-3);"> 分</span></div>
        <div class="exercise-stat-label">日均时长</div>
      </div>
    </div>

    <div class="row-between" style="margin-bottom: 12px;">
      <div class="card-title" style="margin:0;"><div class="card-title-icon">🏃</div>运动记录 (两列五行)</div>
      <button class="btn btn-primary" onclick="openExerciseForm()">+ 添加</button>
    </div>

    <div class="exercise-grid">
      <div class="exercise-cell" style="background: var(--color-bg-soft); font-weight:600; font-size:12px; color:var(--color-text-3);">运动名称</div>
      <div class="exercise-cell" style="background: var(--color-bg-soft); font-weight:600; font-size:12px; color:var(--color-text-3);">累计时长 (分)</div>
      ${items.map(item => `
        <div class="exercise-cell">
          ${item.empty
            ? '<span class="text-3">— 等待打卡</span>'
            : `<div>
                <div class="exercise-cell-name">${escapeHtml(item.name)}</div>
                <div class="fs-12 text-3">${item.list.length} 次</div>
              </div>`}
          <div class="exercise-cell-actions">
            ${item.empty ? '' : `<button title="查看记录" onclick="viewExerciseDetail('${escapeHtml(item.name)}')">📋</button>
                                 <button class="delete" title="删除全部" onclick="deleteExerciseName('${escapeHtml(item.name)}')">🗑</button>`}
          </div>
        </div>
        <div class="exercise-cell">
          ${item.empty ? '<span class="text-3">—</span>' : `<div class="exercise-cell-time">${item.total} 分</div>`}
        </div>
      `).join('')}
    </div>
  `;
}

function openExerciseForm(preset = {}) {
  const body = `
    <div class="form-row">
      <label class="form-label">运动名称</label>
      <input class="input" id="exName" placeholder="如：跑步、瑜伽、撸铁..." value="${escapeHtml(preset.name || '')}">
    </div>
    <div class="form-row">
      <label class="form-label">运动时长 (分钟)</label>
      <input class="input" id="exDuration" type="number" min="1" placeholder="30" value="${preset.duration || ''}">
    </div>
    <div class="form-row">
      <label class="form-label">日期</label>
      <input class="input" id="exDate" type="date" value="${preset.date || todayStr()}">
    </div>
  `;
  const footer = `
    <button class="btn btn-ghost" data-close>取消</button>
    <button class="btn btn-primary" onclick="submitExercise()">保存</button>
  `;
  openModal('添加运动', body, footer);
}

function submitExercise() {
  const name = $('#exName').value.trim();
  const duration = Number($('#exDuration').value);
  const date = $('#exDate').value || todayStr();
  if (!name) { toast('请输入运动名称', 'error'); return; }
  if (!duration || duration <= 0) { toast('请输入有效时长', 'error'); return; }
  state.exercises.push({ id: uid(), name, duration, date });
  saveState();
  closeModal();
  renderContent();
  toast('已记录：' + name + ' ' + duration + ' 分钟');
}

function deleteExerciseName(name) {
  if (!confirm('确认删除「' + name + '」的所有记录？')) return;
  state.exercises = state.exercises.filter(e => e.name !== name);
  saveState();
  renderContent();
  toast('已删除');
}

function viewExerciseDetail(name) {
  const list = state.exercises.filter(e => e.name === name).sort((a, b) => b.date.localeCompare(a.date));
  const body = `
    <div style="font-size:13px; color:var(--color-text-2); margin-bottom:12px;">「${escapeHtml(name)}」共 ${list.length} 次，累计 ${list.reduce((s,e)=>s+e.duration,0)} 分钟</div>
    <div style="max-height:360px; overflow-y:auto;">
      ${list.map(e => `
        <div class="row-between" style="padding:10px 0; border-top:1px solid var(--color-divider);">
          <div>
            <div style="font-size:13px; font-weight:500;">${e.date}</div>
            <div class="fs-12 text-3">${e.duration} 分钟</div>
          </div>
          <button class="btn btn-sm btn-danger" onclick="deleteExercise('${e.id}')">删除</button>
        </div>
      `).join('')}
    </div>
  `;
  openModal('运动记录详情', body);
}

function deleteExercise(id) {
  state.exercises = state.exercises.filter(e => e.id !== id);
  saveState();
  closeModal();
  renderContent();
  toast('已删除');
}

function generateHoldingAdvice() {
  if (state.holdings.length === 0) return '请先添加你的持仓标的，AI 将基于行业分散度、风险集中度给出优化建议。';
  const total = state.holdings.reduce((s, h) => s + Number(h.amount || 0), 0);
  if (total === 0) return '请先添加金额。';
  const sorted = state.holdings.slice().sort((a, b) => b.amount - a.amount);
  const top = sorted[0];
  const topPct = (top.amount / total * 100).toFixed(1);
  let advice = `当前共 ${state.holdings.length} 个持仓，总金额 ¥${fmtMoney(total)}。\n`;
  advice += `• 集中度：最大持仓「${top.name}」占 ${topPct}%，`;
  advice += topPct > 40 ? '⚠️ 单一标的集中度过高，建议分散到 30% 以下。\n' : '✅ 集中度合理。\n';
  advice += `• 行业分布：建议科技/消费/医药/债券均衡配置，避免单押一个赛道。\n`;
  advice += `• 操作建议：每月定投 + 越跌越买，长期持有优质标的，避免频繁交易。\n`;
  advice += `• 风险提示：基金/股票投资有风险，以上不构成具体投资建议。`;
  return advice;
}

function renderDialogues() {
  if (currentDialogues.length === 0) {
    const seed = parseInt(todayStr().replace(/-/g, ''));
    currentDialogues = DIALOGUE_SCENES.map((scene, i) => {
      const items = DIALOGUES[scene];
      return items[(seed + i * 13) % items.length];
    });
  }
  const list = $('#dialogueList');

  list.innerHTML = currentDialogues.map(d => `

          </div>
        </div>
      `).join('')}
    </div>
  `).join('');
}

function renderProEnglish() {
  if (currentProEnglish.length === 0) {
    const seed = parseInt(todayStr().replace(/-/g, ''));
    const indices = [];
    const used = new Set();
    let i = 0;
    while (indices.length < 5 && i < 100) {
      const idx = (seed + i * 7) % PRO_ENGLISH.length;
      if (!used.has(idx)) { used.add(idx); indices.push(idx); }
      i++;
    }
    currentProEnglish = indices.map(i => PRO_ENGLISH[i]);
  }
  const list = $('#proEnglishList');
  if (!list) return;
  list.innerHTML = currentProEnglish.map(p => `
    <div class="english-pro-card">
      <div class="english-pro-title">${escapeHtml(p.title)}</div>
      <div class="english-pro-en">${escapeHtml(p.en)}</div>
      <div class="english-pro-cn">${escapeHtml(p.cn)}</div>
      <div>${p.tags.map(t => `<span class="english-pro-tag">#${escapeHtml(t)}</span>`).join('')}</div>
    </div>
  `).join('');
}

function shuffleDialogue() {
  currentDialogues = [];
  DIALOGUE_SCENES.forEach(scene => {
    const items = DIALOGUES[scene];
    currentDialogues.push(items[Math.floor(Math.random() * items.length)]);
  });
  renderDialogues();
  toast('已换一组');
}

function shuffleProEnglish() {
  currentProEnglish = [];
  const used = new Set();
  while (currentProEnglish.length < 5) {
    const i = Math.floor(Math.random() * PRO_ENGLISH.length);
    if (!used.has(i)) { used.add(i); currentProEnglish.push(PRO_ENGLISH[i]); }
  }
  renderProEnglish();
  toast('已换一组');
}

let savingCalendarDate = new Date();

function viewSaving() {
  const year = savingCalendarDate.getFullYear();
  const month = savingCalendarDate.getMonth();
  const firstDay = new Date(year, month, 1);
  const lastDay = new Date(year, month + 1, 0);
  const startDay = (firstDay.getDay() + 6) % 7;
  const daysInMonth = lastDay.getDate();
  const monthKey = `${year}-${pad(month+1)}`;

  let monthTotal = 0, monthCount = 0;
  Object.entries(state.savings).forEach(([k, v]) => {
    if (k.startsWith(monthKey)) { monthTotal += Number(v); if (v > 0) monthCount++; }
  });
  const yearTotal = Object.entries(state.savings)
    .filter(([k]) => k.startsWith(year + '-'))
    .reduce((s, [, v]) => s + Number(v), 0);

  let dayCells = '';
  const prevLast = new Date(year, month, 0).getDate();
  for (let i = startDay - 1; i >= 0; i--) {
    dayCells += `<div class="saving-day other-month"><div>${prevLast - i}</div></div>`;
  }
  const today = todayStr();
  for (let d = 1; d <= daysInMonth; d++) {
    const k = `${monthKey}-${pad(d)}`;
    const v = state.savings[k];
    const isToday = k === today;
    const hasAmount = v && v > 0;
    dayCells += `
      <div class="saving-day ${isToday ? 'today' : ''} ${hasAmount ? 'has-amount' : ''}" data-date="${k}">
        <div>${d}</div>
        ${hasAmount ? `<div class="saving-day-amount">¥${Number(v) >= 10000 ? (v/10000).toFixed(1) + 'w' : v}</div>` : ''}
      </div>
    `;
  }
  const totalCells = startDay + daysInMonth;
  const nextDays = (7 - totalCells % 7) % 7;
  for (let i = 1; i <= nextDays; i++) {
    dayCells += `<div class="saving-day other-month"><div>${i}</div></div>`;
  }

  const records = Object.entries(state.savings)
    .filter(([k]) => k.startsWith(monthKey))
    .sort((a, b) => b[0].localeCompare(a[0]));

  return `
    <div class="saving-total">
      <div>
        <div class="saving-total-label">${year} 年累计</div>
        <div class="saving-total-value">¥${fmtMoney(yearTotal)}</div>
      </div>
      <div class="saving-total-meta">
        本月 ¥${fmtMoney(monthTotal)}<br>
        ${monthCount} 天有记录
      </div>
    </div>

    <div class="saving-calendar">
      <div class="saving-calendar-head">
        <div class="saving-calendar-month">${year}年${month+1}月</div>
        <div class="saving-calendar-nav">
          <button data-month="-1">‹</button>
          <button data-month="1">›</button>
        </div>
      </div>
      <div class="saving-weekdays">
        <div class="saving-weekday">一</div><div class="saving-weekday">二</div><div class="saving-weekday">三</div>
        <div class="saving-weekday">四</div><div class="saving-weekday">五</div><div class="saving-weekday">六</div><div class="saving-weekday">日</div>
      </div>
      <div class="saving-days">${dayCells}</div>
    </div>

    <div class="card" style="margin-top: 14px;">
      <div class="card-title"><div class="card-title-icon">📝</div>本月记录</div>
      ${records.length === 0 ? '<div class="empty-state"><div class="empty-state-icon">🏦</div>本月还没有存款记录</div>' :
        records.map(([k, v]) => `
          <div class="row-between" style="padding: 10px 0; border-top: 1px solid var(--color-divider);">
            <div style="font-size:13px; font-weight:500;">${k}</div>
            <div class="row-flex">
              <div style="font-size:14px; font-weight:700; color: var(--color-primary);">+¥${fmtMoney(v)}</div>
              <button class="btn btn-sm btn-ghost" data-edit-saving="${k}">编辑</button>
              <button class="btn btn-sm btn-danger" data-del-saving="${k}">删除</button>
            </div>
          </div>
        `).join('')
      }
    </div>
  `;
}

function changeSavingMonth(delta) {
  savingCalendarDate.setMonth(savingCalendarDate.getMonth() + delta);
  renderContent();
}

function openSavingForm(dateKey, presetValue) {
  const v = presetValue !== undefined ? presetValue : (state.savings[dateKey] || '');
  const body = `
    <div class="form-row">
      <label class="form-label">日期</label>
      <input class="input" id="saveDate" type="date" value="${dateKey}">
    </div>
    <div class="form-row">
      <label class="form-label">存款金额 (元)</label>
      <input class="input" id="saveAmount" type="number" min="0" step="0.01" placeholder="1000" value="${v}">
    </div>
  `;
  const footer = `
    <button class="btn btn-ghost" data-close>取消</button>
    <button class="btn btn-primary" onclick="submitSaving()">保存</button>
  `;
  openModal('记录存款', body, footer);
}

function submitSaving() {
  const date = $('#saveDate').value;
  const amount = Number($('#saveAmount').value);
  if (!date) { toast('请选择日期', 'error'); return; }
  if (isNaN(amount) || amount < 0) { toast('请输入有效金额', 'error'); return; }
  if (amount === 0) { delete state.savings[date]; }
  else { state.savings[date] = amount; }
  saveState();
  closeModal();
  renderContent();
  toast('已保存');
}

function deleteSaving(dateKey) {
  if (!confirm('确认删除该记录？')) return;
  delete state.savings[dateKey];
  saveState();
  renderContent();
  toast('已删除');
}

function renderPieChart(data) {
  const total = data.reduce((s, d) => s + d.amount, 0);
  if (total === 0) return '<div class="empty-state">无数据</div>';
  const cx = 80, cy = 80, r = 70;
  let currentAngle = -Math.PI / 2;
  let paths = '';
  data.forEach(d => {
    const angle = (d.amount / total) * 2 * Math.PI;
    const x1 = cx + r * Math.cos(currentAngle);
    const y1 = cy + r * Math.sin(currentAngle);
    const x2 = cx + r * Math.cos(currentAngle + angle);
    const y2 = cy + r * Math.sin(currentAngle + angle);
    const largeArc = angle > Math.PI ? 1 : 0;
    const color = CATEGORY_COLORS[d.name] || '#8A93A6';
    if (data.length === 1) {
      paths += `<circle cx="${cx}" cy="${cy}" r="${r}" fill="${color}" />`;
    } else {
      paths += `<path d="M ${cx} ${cy} L ${x1.toFixed(2)} ${y1.toFixed(2)} A ${r} ${r} 0 ${largeArc} 1 ${x2.toFixed(2)} ${y2.toFixed(2)} Z" fill="${color}" />`;
    }
    currentAngle += angle;
  });
  const cardBg = getComputedStyle(document.documentElement).getPropertyValue('--color-bg-card').trim() || '#fff';
  return `
    <svg class="pie-svg" viewBox="0 0 160 160">
      <circle cx="${cx}" cy="${cy}" r="${r+2}" fill="${cardBg}" />
      ${paths}
      <circle cx="${cx}" cy="${cy}" r="38" fill="${cardBg}" />
      <text x="${cx}" y="${cy-3}" text-anchor="middle" font-size="10" fill="var(--color-text-3)">本月</text>
      <text x="${cx}" y="${cy+12}" text-anchor="middle" font-size="13" font-weight="700" fill="var(--color-text)">¥${fmtMoney(total)}</text>
    </svg>
  `;
}

function generateThoughtSummary(force) {
  if (!force) {
    const cached = localStorage.getItem('fanfei_thought_summary');
    const lastDate = localStorage.getItem('fanfei_thought_summary_date');
    if (cached && lastDate === todayStr()) return cached;
  }
  const recent = state.thoughts.slice(-10);
  const allText = recent.map(t => t.content).join(' ');
  const themes = [];
  const keywords = {
    '成长': ['成长', '进步', '学习', '提升', '改变', '突破'],
    '工作': ['工作', '项目', '客户', '会议', '任务', '加班'],
    '生活': ['生活', '日常', '朋友', '家人', '聚会', '休息'],
    '目标': ['目标', '计划', '梦想', '未来', '方向', '坚持'],
    '情感': ['开心', '难过', '焦虑', '平静', '满足', '感动', '反思'],
    '健康': ['运动', '跑步', '健身', '睡眠', '饮食', '身体'],
    '财务': ['钱', '投资', '存钱', '消费', '理财', '基金'],
  };
  for (const t in keywords) {
    const count = keywords[t].filter(k => allText.includes(k)).length;
    if (count > 0) themes.push({ name: t, count });
  }
  themes.sort((a, b) => b.count - a.count);

  let summary = '';
  if (themes.length === 0) {
    summary = '你最近的想法比较分散，建议在记录时加上标签 #工作 #生活 #成长 等，方便后期总结归纳。';
  } else {
    summary = `📌 本周主题分析：\n`;
    summary += themes.slice(0, 3).map((t, i) => `  ${i+1}. ${t.name} (出现 ${t.count} 次)`).join('\n');
    summary += '\n\n💡 洞察提炼：\n';
    if (themes[0].name === '成长') summary += '• 你近期对自我提升有较强的意愿，建议把目标拆解为可执行的 7 天小步骤。';
    else if (themes[0].name === '工作') summary += '• 工作内容占据你大部分思绪，注意劳逸结合，避免长期高负荷运转。';
    else if (themes[0].name === '目标') summary += '• 你对未来有清晰的方向感。建议写下"如果……那么……"的承诺机制，提高执行率。';
    else if (themes[0].name === '情感') summary += '• 你的情绪较为丰富，正视它们并定期复盘，是情绪管理的好习惯。';
    else if (themes[0].name === '健康') summary += '• 关注健康是好兆头，坚持打卡让数据可视化，会更持久。';
    else if (themes[0].name === '财务') summary += '• 财务意识在觉醒，建议结合"投资"模块建立资产配置方案。';
    else summary += '• 继续保持记录，复盘本身就是一种成长。';
    summary += '\n\n🌱 行动建议：\n  ① 每天固定 10 分钟记录，让想法落地\n  ② 周末用 30 分钟做一次月度主题回顾\n  ③ 找到一位同频的伙伴，互相激励';
  }
  localStorage.setItem('fanfei_thought_summary', summary);
  localStorage.setItem('fanfei_thought_summary_date', todayStr());
  return summary;
}

function autoSkillSuggestion(name, level) {
  const templates = {
    low: [
      `从基础教材开始，每天投入 30 分钟，建立核心概念。推荐《${name}入门到精通》、《${name}实战教程》。`,
      `加入相关技术社区（如 CSDN、知乎、B站），关注 3-5 位领域博主，跟随项目实操。`,
    ],
    mid: [
      `已具备基础，建议找 1-2 个真实项目练手，输出可展示的作品集。`,
      `阅读 2-3 本进阶书籍，把零散知识系统化，形成自己的方法论。`,
    ],
    high: [
      `进入瓶颈期，建议在垂直方向深耕，比如考取相关认证（PMP/HCIA/HCIP），或参加行业会议。`,
      `尝试教学相长——在 B站/知乎输出技术文章，倒逼自己系统化思考。`,
    ],
  };
  const tier = level <= 2 ? 'low' : level <= 4 ? 'mid' : 'high';
  const tpl = templates[tier];
  return tpl[Math.floor(Math.random() * tpl.length)];
}

    if (state.customColors[key]) return state.customColors[key];
    return root.getPropertyValue(key).trim() || def;
  };

  return `
    <div class="dev-section">
      <div class="dev-section-title">🌓 主题切换</div>
      <div class="theme-switch">
        <button class="${state.theme === 'light' ? 'active' : ''}" data-theme="light">☀️ 浅色</button>
        <button class="${state.theme === 'dark' ? 'active' : ''}" data-theme="dark">🌙 暗色</button>
      </div>
    </div>

    <div class="dev-section">
      <div class="dev-section-title">🎨 配色实时调整</div>
      <div class="card">
        ${COLOR_VARS.map(c => `
          <div class="dev-row">
            <div class="dev-row-label">${c.label}</div>
            <input type="color" data-color="${c.key}" value="${currentVal(c.key, c.def)}">
            <input type="text" data-color-text="${c.key}" value="${currentVal(c.key, c.def)}" maxlength="20">
          </div>
        `).join('')}
        <div style="display:flex; gap:8px; margin-top:12px;">
          <button class="btn btn-ghost btn-sm" onclick="resetColors()">🔄 恢复默认</button>
          <button class="btn btn-soft btn-sm" onclick="exportColors()">📤 导出配色</button>
        </div>
      </div>
    </div>

    <div class="dev-section">
      <div class="dev-section-title">🔤 字体设置</div>
      <div class="card">
        <div class="form-row">
          <label class="form-label">字体 (vivo Sans / 系统默认)</label>
          <select class="select" id="fontSelect">
            <option value='"vivo Sans", "HarmonyOS Sans SC", "Source Han Sans CN", "Noto Sans CJK SC", "PingFang SC", system-ui, sans-serif' selected>vivo Sans (推荐)</option>
            <option value='"PingFang SC", "Microsoft YaHei", sans-serif'>苹方 / 微软雅黑</option>
            <option value='"Source Han Sans CN", "Noto Sans CJK SC", sans-serif'>思源黑体</option>
            <option value='"KaiTi", "STKaiti", serif'>楷体</option>
            <option value='system-ui, -apple-system, sans-serif'>系统默认</option>
          </select>
        </div>
        <div class="form-row">
          <label class="form-label">字号 (基础)</label>
          <input type="range" min="12" max="18" value="14" id="fontSize">
          <div class="fs-12 text-3" style="text-align:center; margin-top:4px;" id="fontSizeLabel">14px</div>
        </div>
      </div>
    </div>
  `;
}

function setColor(key, value) {
  state.customColors[key] = value;
  document.documentElement.style.setProperty(key, value);
  saveState();
}

function resetColors() {
  if (!confirm('恢复所有配色到默认？')) return;
  state.customColors = {};
  localStorage.removeItem(COLOR_KEY);
  document.documentElement.style.cssText = '';
  applyTheme(state.theme);
  renderContent();
  toast('已恢复默认');
}

function exportColors() {
  const data = JSON.stringify(state.customColors, null, 2);
  navigator.clipboard.writeText(data).then(() => toast('已复制到剪贴板'));
}

/* ==========================================================
   全局事件绑定
   ========================================================== */
function bindModuleEvents() {
  // Tabs
  $$('.tabs').forEach(tabsEl => {
    tabsEl.querySelectorAll('.tab').forEach(tab => {
      tab.addEventListener('click', () => {
        tabsEl.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        const target = tab.dataset.tab;
        const parent = tabsEl.parentElement;
        parent.querySelectorAll('.tab-panel').forEach(p => {
          p.classList.toggle('active', p.dataset.tab === target);
        });
        if (target === 'daily') renderDialogues();
        if (target === 'pro') renderProEnglish();
      });
    });
  });

  // Saving: month nav
  $$('[data-month]').forEach(b => {
    b.addEventListener('click', () => changeSavingMonth(Number(b.dataset.month)));
  });
  // Saving: day click
  $$('.saving-day[data-date]').forEach(el => {
    el.addEventListener('click', () => openSavingForm(el.dataset.date));
  });
  $$('[data-edit-saving]').forEach(b => {
    b.addEventListener('click', () => openSavingForm(b.dataset.editSaving, state.savings[b.dataset.editSaving]));
  });
  $$('[data-del-saving]').forEach(b => {
    b.addEventListener('click', () => deleteSaving(b.dataset.delSaving));
  });

  // Expenses
  $$('[data-del-expense]').forEach(b => {
    b.addEventListener('click', () => deleteExpense(b.dataset.delExpense));
  });

  // Books
  $$('[data-edit-book]').forEach(b => {
    b.addEventListener('click', () => {
      const book = state.books.find(x => x.id === b.dataset.editBook);
      if (book) openBookForm(book);
    });
  });
  $$('[data-del-book]').forEach(b => {
    b.addEventListener('click', () => deleteBook(b.dataset.delBook));
  });

  // Thoughts
  $$('[data-edit-thought]').forEach(b => {
    b.addEventListener('click', () => {
      const t = state.thoughts.find(x => x.id === b.dataset.editThought);
      if (t) openThoughtForm(t);
    });
  });
  $$('[data-del-thought]').forEach(b => {
    b.addEventListener('click', () => deleteThought(b.dataset.delThought));
  });

  // Skills
  $$('[data-edit-skill]').forEach(b => {
    b.addEventListener('click', () => {
      const s = state.skills.find(x => x.id === b.dataset.editSkill);
      if (s) openSkillForm(s);
    });
  });
  $$('[data-del-skill]').forEach(b => {
    b.addEventListener('click', () => deleteSkill(b.dataset.delSkill));
  });

  // Theme switch (developer)
  $$('[data-theme]').forEach(b => {
    b.addEventListener('click', () => {
      applyTheme(b.dataset.theme);
      renderContent();
    });
  });

  // Color pickers
  $$('[data-color]').forEach(inp => {
    inp.addEventListener('input', e => {
      const key = inp.dataset.color;
      const v = e.target.value;
      setColor(key, v);
      const text = document.querySelector(`[data-color-text="${key}"]`);
      if (text) text.value = v;
    });
  });
  $$('[data-color-text]').forEach(inp => {
    inp.addEventListener('change', e => {
      setColor(inp.dataset.colorText, e.target.value);
      const cp = document.querySelector(`[data-color="${inp.dataset.colorText}"]`);
      if (cp) cp.value = e.target.value;
    });
  });

  // Font
  const fontSel = $('#fontSelect');
  if (fontSel) {
    fontSel.addEventListener('change', e => {
      document.documentElement.style.setProperty('--font-family', e.target.value);
    });
  }
  const fontSize = $('#fontSize');
  if (fontSize) {
    fontSize.addEventListener('input', e => {
      const v = e.target.value + 'px';
      document.documentElement.style.fontSize = v;
      document.body.style.fontSize = v;
      const lbl = $('#fontSizeLabel');
      if (lbl) lbl.textContent = v;
    });
  }

  // Home quick action
  $$('[data-go]').forEach(b => {
    b.addEventListener('click', () => switchModule(b.dataset.go));
  });
}

function bindGlobalEvents() {
  // 侧边栏底部按钮
  $$('[data-action]').forEach(b => {
    b.addEventListener('click', () => handleAction(b.dataset.action));
  });
  // 顶部汉堡菜单
  const menuBtn = $('#topbarMenu');
  if (menuBtn) menuBtn.addEventListener('click', toggleSidebar);
  // 快速添加
  const addBtn = $('#topbarAdd');
  if (addBtn) addBtn.addEventListener('click', openQuickAdd);
  const fab = $('#fabBtn');
  if (fab) fab.addEventListener('click', openQuickAdd);
  // 遮罩关闭侧边栏
  const overlay = $('#sidebarOverlay');
  if (overlay) overlay.addEventListener('click', closeSidebar);
  // 模态框关闭
  $('#modalMask').addEventListener('click', e => {
    if (e.target.id === 'modalMask' || e.target.hasAttribute('data-close')) closeModal();
  });
  // ESC 关闭
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') { closeModal(); closeSidebar(); }
  });
}

function toggleSidebar() {
  const sb = $('.sidebar');
  const ov = $('#sidebarOverlay');
  sb.classList.toggle('open');
  ov.classList.toggle('show', sb.classList.contains('open'));
}
function closeSidebar() {
  const sb = $('.sidebar');
  const ov = $('#sidebarOverlay');
  sb.classList.remove('open');
  ov.classList.remove('show');
}

function openQuickAdd() {
  const map = {
    home: () => openQuickAddMenu(),
    sleep: () => recordSleepNow(),
    exercise: () => openExerciseForm(),
    invest: () => openHoldingForm(),
    saving: () => openSavingForm(todayStr()),
    expense: () => openExpenseForm(),
    reading: () => openBookForm(),
    thoughts: () => openThoughtForm(),
    skill: () => openSkillForm(),

  }

/* ==========================================================
   周度报告
   ========================================================== */
function openWeeklyReport() {
  const today = new Date();
  const day = (today.getDay() + 6) % 7;
  const weekStart = new Date(today);
  weekStart.setDate(today.getDate() - day);
  const weekStartStr = dateStr(weekStart);
  const monthKey = today.toISOString().slice(0, 7);

  // 睡眠
  const sleepCount = Object.keys(state.sleep).filter(k => k >= weekStartStr && k <= todayStr()).length;
  // 运动
  const exWeek = state.exercises.filter(e => e.date >= weekStartStr);
  const exMin = exWeek.reduce((s, e) => s + e.duration, 0);
  // 支出
  const expMonth = state.expenses.filter(e => e.date.startsWith(monthKey));
  const expTotal = expMonth.reduce((s, e) => s + e.amount, 0);
  // 存款
  const saveMonth = Object.entries(state.savings).filter(([k]) => k.startsWith(monthKey)).reduce((s, [, v]) => s + v, 0);
  // 想法
  const thoughtWeek = state.thoughts.filter(t => t.date >= weekStartStr);
  // 看书
  const bookCount = state.books.length;
  // 英语 (假设每天5个对话=5个)
  const dialogueCount = 5 * 7;
  // 技能
  const skillAvg = state.skills.length ? (state.skills.reduce((s, x) => s + x.level, 0) / state.skills.length).toFixed(1) : 0;

  // AI 洞察
  const insights = [];
  if (sleepCount < 4) insights.push('⚠️ 本周睡眠记录不足 4 天，建议每晚 22:30 前放下手机，固定作息。');
  else if (sleepCount >= 6) insights.push('✅ 本周睡眠记录充足，继续保持规律作息。');

  if (exMin < 60) insights.push('⚠️ 本周运动不足 60 分钟。世界卫生组织建议每周 150 分钟中等强度运动，可拆为每天 20 分钟。');
  else if (exMin >= 150) insights.push('✅ 本周运动达标，建议搭配有氧+力量训练。');
  else insights.push(`ℹ️ 本周运动 ${exMin} 分钟，距离每周 150 分钟目标还差 ${150 - exMin} 分钟。`);

  if (expTotal > 3000) insights.push('⚠️ 本月支出偏高，建议复盘非必要消费，考虑"72 小时法则"：非紧急物品先放 3 天再决定。');
  if (saveMonth > 0) insights.push(`✅ 本月已存 ¥${fmtMoney(saveMonth)}，建议养成"先储蓄后消费"的习惯（收入 - 储蓄 = 可花）。`);

  if (thoughtWeek.length === 0) insights.push('ℹ️ 本周没有记录想法，建议每天睡前 5 分钟写下 1 条反思或灵感。');
  else if (thoughtWeek.length >= 5) insights.push('✅ 你坚持记录想法，本周 AI 总结已生成。');

  if (state.skills.length === 0) insights.push('ℹ️ 技能清单为空，建议列出 3-5 项想要精进的核心技能。');

  if (insights.length === 0) insights.push('✨ 本周各模块表现均衡，继续保持！');

  const aiText = insights.join('\n\n');

  const body = `
    <div class="report-section">
      <div class="report-section-title">📊 本周概览 (${weekStartStr} ~ ${todayStr()})</div>
      <div class="report-grid">
        <div class="report-stat"><div class="report-stat-label">睡眠记录</div><div class="report-stat-value">${sleepCount}<span style="font-size:11px;color:var(--color-text-3);">/7</span></div></div>
        <div class="report-stat"><div class="report-stat-label">运动时长</div><div class="report-stat-value">${exMin}<span style="font-size:11px;color:var(--color-text-3);">分</span></div></div>
        <div class="report-stat"><div class="report-stat-label">本月支出</div><div class="report-stat-value">¥${fmtMoney(expTotal)}</div></div>
        <div class="report-stat"><div class="report-stat-label">本月存款</div><div class="report-stat-value">¥${fmtMoney(saveMonth)}</div></div>
        <div class="report-stat"><div class="report-stat-label">想法记录</div><div class="report-stat-value">${thoughtWeek.length}<span style="font-size:11px;color:var(--text-3);">条</span></div></div>
        <div class="report-stat"><div class="report-stat-label">阅读书目</div><div class="report-stat-value">${bookCount}<span style="font-size:11px;color:var(--color-text-3);">本</span></div></div>
        <div class="report-stat"><div class="report-stat-label">英语对话</div><div class="report-stat-value">${dialogueCount}<span style="font-size:11px;color:var(--color-text-3);">组</span></div></div>
        <div class="report-stat"><div class="report-stat-label">技能均分</div><div class="report-stat-value">${skillAvg}<span style="font-size:11px;color:var(--color-text-3);">/5</span></div></div>
      </div>
    </div>
    <div class="report-section">
      <div class="report-section-title">🤖 AI 洞察建议</div>
      <div class="report-ai-box">${escapeHtml(aiText)}</div>
    </div>
  `;
  openModal('📊 周度数据分析报告', body, `<button class="btn btn-primary" data-close>关闭</button>`, true);
}

      <p class="text-3 fs-12" style="margin-bottom:10px;">关闭后该板块在侧边栏隐藏，刷新页面后生效。</p>
      <div id="settingsList">
        ${state.modules.map(m => `
          <div class="setting-item" data-mod-item="${m.id}">

            <div>
              <div class="setting-item-name">${escapeHtml(m.name)}</div>

          <div class="form-grid" style="grid-template-columns: 80px 1fr 110px auto;">
            <input class="input" id="newModIcon" placeholder="🎯" maxlength="2" value="📌">
            <input class="input" id="newModName" placeholder="板块名称">
            <select class="select" id="newModGroup">
              <option value="life">生活</option>
              <option value="finance">财务</option>
              <option value="growth">成长</option>
              <option value="me">我的</option>

            <button class="btn btn-primary" onclick="addCustomModule()">+ 添加</button>
          </div>
        </div>
      </div>
    </div>
  `;

    $$('[data-toggle-mod]').forEach(sw => {
      sw.addEventListener('click', () => {
        const m = state.modules.find(x => x.id === sw.dataset.toggleMod);

          m.visible = !m.visible;
          sw.classList.toggle('on', m.visible);

function addCustomModule() {
  const icon = $('#newModIcon').value.trim() || '📌';
  const name = $('#newModName').value.trim();
  const group = $('#newModGroup').value;
  if (!name) { toast('请输入板块名称', 'error'); return; }
  const id = 'custom_' + Date.now().toString(36);
  state.modules.push({ id, name, icon, group, visible: true, builtIn: false, custom: true });
  saveState();
  renderSidebar();
  openSettings();
  toast('已添加：' + name);
}

/* ==========================================================
   备份与恢复
   ========================================================== */
function openBackup() {
  const body = `
    <div class="report-section">
      <div class="report-section-title">📤 导出数据</div>
      <p class="text-3 fs-12" style="margin-bottom:8px;">将所有数据导出为 JSON 文件，可用于备份或在其他设备恢复。</p>
      <button class="btn btn-primary" onclick="exportData()">📤 导出为 JSON</button>
    </div>
    <div class="report-section">
      <div class="report-section-title">📥 导入数据</div>
      <p class="text-3 fs-12" style="margin-bottom:8px;">导入之前导出的 JSON 文件，恢复全部数据。<br><strong>注意：导入将覆盖当前所有数据！</strong></p>
      <input type="file" id="importFile" accept=".json" style="margin-bottom:8px;">
      <div><button class="btn btn-soft" onclick="importData()">📥 选择并导入</button></div>
    </div>
    <div class="report-section">
      <div class="report-section-title">⚠️ 危险操作</div>
      <button class="btn btn-danger" onclick="clearAllData()">🗑 清空所有数据</button>
    </div>
  `;
  openModal('💾 数据备份', body, `<button class="btn btn-primary" data-close>关闭</button>`, true);
}

function exportData() {
  const data = {
    version: 1,
    exportDate: new Date().toISOString(),
    sleep: state.sleep, exercises: state.exercises, holdings: state.holdings,
    savings: state.savings, expenses: state.expenses, books: state.books,
    thoughts: state.thoughts, skills: state.skills,
    settings: { theme: state.theme, modules: state.modules, customColors: state.customColors },
  };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `帆飞之路-备份-${todayStr()}.json`;
  a.click();
  URL.revokeObjectURL(url);
  toast('已导出');
}

function importData() {
  const file = $('#importFile').files[0];
  if (!file) { toast('请先选择文件', 'error'); return; }
  if (!confirm('导入将覆盖当前所有数据，确认继续？')) return;
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const data = JSON.parse(e.target.result);
      if (data.sleep) state.sleep = data.sleep;
      if (data.exercises) state.exercises = data.exercises;
      if (data.holdings) state.holdings = data.holdings;
      if (data.savings) state.savings = data.savings;
      if (data.expenses) state.expenses = data.expenses;
      if (data.books) state.books = data.books;
      if (data.thoughts) state.thoughts = data.thoughts;
      if (data.skills) state.skills = data.skills;
      if (data.settings) {
        if (data.settings.theme) state.theme = data.settings.theme;
        if (data.settings.modules) state.modules = data.settings.modules;
        if (data.settings.customColors) state.customColors = data.settings.customColors;
      }
      saveState();
      applyTheme(state.theme);
      applyCustomColors();
      renderSidebar();
      renderContent();
      closeModal();
      toast('导入成功');
    } catch (err) {
      toast('导入失败：' + err.message, 'error');
    }
  };
  reader.readAsText(file);
}

function clearAllData() {
  if (!confirm('确认清空所有数据？此操作不可恢复！')) return;
  if (!confirm('再次确认：所有记录将被永久删除！')) return;
  localStorage.removeItem(STORE_KEY);
  localStorage.removeItem(SETTINGS_KEY);
  localStorage.removeItem(COLOR_KEY);
  localStorage.removeItem('fanfei_thought_summary');
  localStorage.removeItem('fanfei_thought_summary_date');
  state.sleep = {}; state.exercises = []; state.holdings = []; state.savings = {};
  state.expenses = []; state.books = []; state.thoughts = []; state.skills = [];
  state.modules = defaultModules.slice();
  state.theme = 'light';
  state.customColors = {};
  applyTheme('light');
  applyCustomColors();
  renderSidebar();
  renderContent();
  closeModal();
  toast('已清空所有数据');
}

/* ==========================================================
   初始化
   ========================================================== */
function init() {
  try {
    loadState();
    applyTheme(state.theme);
    applyCustomColors();
    renderSidebar();
    renderContent();
    bindGlobalEvents();
    // 注册 Service Worker (PWA 离线支持)
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('service-worker.js').then(() => {
        console.log('SW registered');
      }).catch(err => console.log('SW failed:', err));
    }
  } catch (e) {
    console.error('Init error:', e);
    document.body.innerHTML = '<div style="padding:40px 20px;text-align:center;font-family:sans-serif;"><div style="font-size:48px;margin-bottom:16px;">😕</div><div style="font-size:16px;font-weight:600;margin-bottom:8px;color:#1F2937;">页面加载出错</div><div style="font-size:13px;color:#5E6A7E;max-width:300px;margin:0 auto;">' + (e.message || '未知错误') + '</div><div style="margin-top:20px;"><a href="https://fan2130.github.io/fanfei-app/" style="display:inline-block;padding:10px 24px;background:#4A8DFF;color:#fff;border-radius:12px;text-decoration:none;font-size:14px;">重新加载</a></div></div>';
  }
  // 隐藏加载屏
  var bs = document.getElementById('bootScreen');
  if (bs) { bs.style.opacity = '0'; setTimeout(function(){ bs.style.display = 'none'; }, 300); }
}

document.addEventListener('DOMContentLoaded', init);
if (document.readyState !== 'loading') init();
</script>

</html>
